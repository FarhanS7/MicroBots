name: CI Quality Gates

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Public Docs Check
        run: python scripts/check_docs.py

      - name: Install Monorepo Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Protocol and Web Workspace
        run: pnpm build

      - name: Test Protocol Workspace
        run: pnpm test:protocol

      - name: Typecheck TypeScript Workspace
        run: pnpm typecheck

      - name: Install Backend Package
        run: |
          cd services/backend
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Backend Unit Test Suite
        run: |
          cd services/backend
          python -m pytest tests/unit/ -v

      - name: Run Backend Application Contract & DB Integration Tests
        run: |
          cd services/backend
          python -m pytest tests/integration/test_app_contract.py tests/integration/test_db_migrations.py -v
