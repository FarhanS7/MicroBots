[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microbots-executor"
version = "0.1.0"
description = "MicroBots Sandboxed Execution Broker Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "playwright>=1.42.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "ruff>=0.3.0",
]
