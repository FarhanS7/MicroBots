version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: microbots-postgres
    environment:
      POSTGRES_USER: microbots
      POSTGRES_PASSWORD: microbotspassword
      POSTGRES_DB: microbots_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microbots -d microbots_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.23.0
    container_name: microbots-temporal
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=microbots
      - POSTGRES_PWD=microbotspassword
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.24.0
    container_name: microbots-temporal-ui
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    depends_on:
      - temporal

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    container_name: microbots-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://microbots:microbotspassword@postgres:5432/microbots_dev
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: microbots-web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
